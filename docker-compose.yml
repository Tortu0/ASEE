services:
  postgres-usuarios:
    image: postgres:15-alpine
    container_name: db_usuarios
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_usuarios
    ports:
      - "5672:5672"   # Puerto interno de comunicación para Java
      - "15672:15672" # Puerto para la interfaz web (Panel de control)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
volumes:
  postgres_usuarios_data: