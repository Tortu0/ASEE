openapi: 3.0.3
info:
  title: API de Usuarios, Identidad y Accesos
  description: >
    Microservicio propietario de la identidad, la autenticación (JWT) y el
    estado de socio. No realiza llamadas síncronas a otros microservicios:
    es consultado por Entradas (estado de socio), Compras (descuento de
    socio) y Front-end (login y permisos por rol). Se accede siempre a
    través del API Gateway.
  version: 1.0.0

servers:
  - url: https://api.club.example/usuarios/v1
    description: Servidor de producción (vía API Gateway)
  - url: http://localhost:8081/v1
    description: Entorno local de desarrollo

tags:
  - name: Autenticación
    description: Login y emisión de tokens JWT
  - name: Usuarios
    description: Gestión de perfiles de usuario
  - name: Socios
    description: Estado de socio, cuota y renovaciones
  - name: Historial
    description: Histórico de actividad del usuario

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Valida las credenciales y devuelve un token JWT con expiración.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /usuarios:
    post:
      tags: [Usuarios]
      summary: Registrar un nuevo usuario
      description: Crea un usuario con rol "visitante" por defecto. La contraseña se almacena con hash y salt.
      operationId: crearUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe un usuario con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo admin)
      operationId: listarUsuarios
      security:
        - bearerAuth: []
      parameters:
        - name: rol
          in: query
          description: Filtrar por rol
          schema:
            $ref: '#/components/schemas/Rol'
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Listado paginado de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Usuarios]
      summary: Obtener el perfil de un usuario
      description: >
        Un usuario solo puede ver su propio perfil; staff y admin pueden ver
        cualquiera. Este es el recurso que consultan Entradas y Compras (vía
        /usuarios/{usuarioId}/socio) para validar al comprador.
      operationId: obtenerUsuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No existe ningún usuario con el identificador indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Usuarios]
      summary: Actualizar datos personales
      operationId: actualizarUsuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Usuarios]
      summary: Eliminar un usuario (solo admin)
      operationId: eliminarUsuario
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuario eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /usuarios/{usuarioId}/rol:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    put:
      tags: [Usuarios]
      summary: Cambiar el rol de un usuario (solo admin)
      operationId: cambiarRol
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol:
                  $ref: '#/components/schemas/Rol'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /usuarios/{usuarioId}/socio:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Socios]
      summary: Consultar el estado de socio
      description: >
        Endpoint consultado síncronamente por otros microservicios para
        comprobar si se aplica descuento de socio:

        Entradas -> Usuarios -> GET /usuarios/{usuarioId}/socio

        Compras -> Usuarios -> GET /usuarios/{usuarioId}/socio
      operationId: obtenerSocio
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado de socio del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            No existe ningún usuario con el identificador indicado. Este es
            el 404 que recibirán Entradas o Compras si el usuarioId que
            envían no existe en este servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Socios]
      summary: Dar de alta o renovar la condición de socio
      description: Solo staff o admin. Pasa al usuario a rol "socio" y fija cuota y caducidad.
      operationId: actualizarSocio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocioUpdate'
      responses:
        '200':
          description: Condición de socio actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Socio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /usuarios/{usuarioId}/historial:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Historial]
      summary: Histórico de actividad del usuario
      description: Compras de entradas y de merchandising asociadas al perfil.
      operationId: obtenerHistorial
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
            enum: [entrada, pedido]
      responses:
        '200':
          description: Lista de actividades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actividad'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Historial]
      summary: Registrar una actividad en el historial
      description: >
        Uso interno: lo invocan Entradas y Compras de forma síncrona tras una
        compra, o se alimenta de forma asíncrona mediante los eventos del
        Message Broker ("entrada comprada", "pedido creado").

        Entradas -> Usuarios -> POST /usuarios/{usuarioId}/historial

        Compras -> Usuarios -> POST /usuarios/{usuarioId}/historial
      operationId: registrarActividad
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Actividad'
      responses:
        '201':
          description: Actividad registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actividad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT con expiración, validado por el API Gateway.

  parameters:
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: Identificador único del usuario
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición mal formada o datos no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no tiene permisos para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Límite de peticiones superado (rate limiting del Gateway)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: integer
          example: 404
        mensaje:
          type: string
          example: Recurso no encontrado
        detalles:
          type: array
          items:
            type: string

    Rol:
      type: string
      enum: [visitante, socio, staff, admin]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: aficionado@correo.es
        password:
          type: string
          format: password
          example: MiClaveSegura123

    LoginResponse:
      type: object
      required: [token, tipo, expiraEn, usuario]
      properties:
        token:
          type: string
          description: Token JWT firmado
        tipo:
          type: string
          example: Bearer
        expiraEn:
          type: integer
          description: Segundos hasta la expiración
          example: 3600
        usuario:
          $ref: '#/components/schemas/Usuario'

    Usuario:
      type: object
      required: [usuarioId, nombre, email, rol]
      properties:
        usuarioId:
          type: string
          format: uuid
        nombre:
          type: string
          example: Laura Martín
        email:
          type: string
          format: email
        telefono:
          type: string
          example: '+34600123456'
        direccion:
          type: string
          example: Calle Mayor 12, 10260 Madroñera
        rol:
          $ref: '#/components/schemas/Rol'
        fechaAlta:
          type: string
          format: date-time

    UsuarioCreate:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        telefono:
          type: string
        direccion:
          type: string

    UsuarioUpdate:
      type: object
      properties:
        nombre:
          type: string
        telefono:
          type: string
        direccion:
          type: string

    Socio:
      type: object
      required: [usuarioId, estado]
      properties:
        usuarioId:
          type: string
          format: uuid
        numeroSocio:
          type: string
          example: S-000123
        estado:
          type: string
          enum: [activo, caducado, no_socio]
        tipoCuota:
          type: string
          enum: [mensual, anual, juvenil, jubilado]
        fechaAlta:
          type: string
          format: date
        fechaCaducidad:
          type: string
          format: date
        descuentoPorcentaje:
          type: number
          description: Descuento aplicable en entradas y merchandising
          example: 15

    SocioUpdate:
      type: object
      required: [tipoCuota, fechaCaducidad]
      properties:
        tipoCuota:
          type: string
          enum: [mensual, anual, juvenil, jubilado]
        fechaCaducidad:
          type: string
          format: date

    Actividad:
      type: object
      required: [tipo, referenciaId, fecha]
      properties:
        tipo:
          type: string
          enum: [entrada, pedido]
        referenciaId:
          type: string
          description: ID de la entrada o del pedido en su microservicio
        descripcion:
          type: string
          example: Entrada zona A, fila 3, asiento 12
        importe:
          type: number
          format: float
        fecha:
          type: string
          format: date-time
