openapi: 3.0.3
info:
  title: API de Compras (Merchandising)
  description: >
    Microservicio de la tienda online del club: catálogo, carrito y pedidos.
    Realiza una llamada síncrona a otro microservicio:

    Compras -> Usuarios -> GET /usuarios/{usuarioId}/socio (para aplicar el
    descuento de socio al confirmar un pedido)

    Comparte pasarela de pago y sistema de facturación con Entradas. Se
    accede siempre a través del API Gateway.
  version: 1.0.0

servers:
  - url: https://api.club.example/compras/v1
    description: Servidor de producción (vía API Gateway)
  - url: http://localhost:8084/v1
    description: Entorno local de desarrollo

tags:
  - name: Productos
    description: Catálogo de merchandising
  - name: Carrito
    description: Carrito del usuario autenticado
  - name: Pedidos
    description: Pedidos y su seguimiento

paths:
  /productos:
    get:
      tags: [Productos]
      summary: Listar el catálogo
      operationId: listarProductos
      security: []
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
            enum: [camiseta, bufanda, gorra, accesorio, otro]
        - name: jugadorId
          in: query
          description: Productos asociados a un jugador (camisetas con su dorsal)
          schema:
            type: string
            format: uuid
        - name: patrocinadorId
          in: query
          description: Productos patrocinados por una marca
          schema:
            type: string
            format: uuid
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Listado paginado de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Productos]
      summary: Añadir un producto al catálogo (staff/admin)
      operationId: crearProducto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreate'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /productos/{productoId}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      summary: Obtener un producto
      operationId: obtenerProducto
      security: []
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Productos]
      summary: Actualizar precio, stock o datos (staff/admin)
      operationId: actualizarProducto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCreate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Productos]
      summary: Retirar un producto del catálogo (admin)
      operationId: eliminarProducto
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Producto eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /carrito:
    get:
      tags: [Carrito]
      summary: Ver el carrito del usuario autenticado
      operationId: obtenerCarrito
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Carrito con totales y descuento de socio aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Carrito]
      summary: Vaciar el carrito
      operationId: vaciarCarrito
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Carrito vaciado
        '401':
          $ref: '#/components/responses/Unauthorized'

  /carrito/items:
    post:
      tags: [Carrito]
      summary: Añadir un producto al carrito
      operationId: anadirAlCarrito
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCarritoCreate'
      responses:
        '201':
          description: Carrito actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe ningún producto con ese identificador en este servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No hay stock suficiente de esa talla
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /carrito/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Carrito]
      summary: Cambiar la cantidad de un elemento del carrito
      operationId: actualizarItemCarrito
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad]
              properties:
                cantidad:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Carrito actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrito'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No hay stock suficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Carrito]
      summary: Quitar un elemento del carrito
      operationId: quitarDelCarrito
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Elemento eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /pedidos:
    post:
      tags: [Pedidos]
      summary: Confirmar el carrito y pagar el pedido
      description: >
        Descuenta el stock y procesa el pago con la pasarela compartida con
        Entradas.

        Antes de calcular el total, este servicio consulta al microservicio
        Usuarios mediante GET /usuarios/{usuarioId}/socio para saber si debe
        aplicarse el descuento de socio. Se trata de una COMUNICACIÓN
        SÍNCRONA de tipo CONSULTA:

        Compras -> Usuarios -> GET /usuarios/{usuarioId}/socio

        Tras el pago, se publica en el Message Broker el evento asíncrono
        "pedido creado", que consume Usuarios para añadir la actividad al
        historial del comprador.
      operationId: crearPedido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCreate'
      responses:
        '201':
          description: Pedido creado
          headers:
            Location:
              description: URL del pedido
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: El pago ha sido rechazado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            El usuario indicado no existe, según la consulta realizada a
            Usuarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El carrito está vacío o algún producto se ha quedado sin stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >
            No se ha podido comprobar el estado de socio del comprador porque
            el microservicio Usuarios no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Pedidos]
      summary: Listar pedidos (los propios, o cualquiera si eres staff/admin)
      operationId: listarPedidos
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: query
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoPedido'
      responses:
        '200':
          description: Listado de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pedidos/{pedidoId}:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      tags: [Pedidos]
      summary: Obtener un pedido
      operationId: obtenerPedido
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pedidos]
      summary: Cancelar un pedido aún no enviado
      operationId: cancelarPedido
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Pedido cancelado y stock repuesto
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pedido ya ha sido enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pedidos/{pedidoId}/estado:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    put:
      tags: [Pedidos]
      summary: Cambiar el estado de un pedido (staff/admin)
      operationId: cambiarEstadoPedido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoPedido'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT con expiración, validado por el API Gateway.

  parameters:
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PedidoId:
      name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición mal formada o datos no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no tiene permisos para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: integer
          example: 404
        mensaje:
          type: string
          example: Recurso no encontrado
        detalles:
          type: array
          items:
            type: string

    EstadoPedido:
      type: string
      enum: [pendiente, pagado, preparando, enviado, entregado, cancelado]

    MetodoPago:
      type: string
      enum: [tarjeta, bizum, paypal]

    StockTalla:
      type: object
      required: [talla, unidades]
      properties:
        talla:
          type: string
          example: M
        unidades:
          type: integer
          minimum: 0

    Producto:
      type: object
      required: [productoId, nombre, precio, categoria]
      properties:
        productoId:
          type: string
          format: uuid
        nombre:
          type: string
          example: Camiseta oficial 2026-2027
        descripcion:
          type: string
        categoria:
          type: string
          enum: [camiseta, bufanda, gorra, accesorio, otro]
        precio:
          type: number
          format: float
          example: 39.95
        stock:
          type: array
          items:
            $ref: '#/components/schemas/StockTalla'
        fotos:
          type: array
          items:
            type: string
            format: uri
        jugadorId:
          type: string
          format: uuid
          description: Jugador asociado, si es una camiseta con su dorsal
        patrocinadorId:
          type: string
          format: uuid
          description: Patrocinador del producto (ver API Institucional)

    ProductoCreate:
      type: object
      required: [nombre, precio, categoria]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
          enum: [camiseta, bufanda, gorra, accesorio, otro]
        precio:
          type: number
          format: float
        stock:
          type: array
          items:
            $ref: '#/components/schemas/StockTalla'
        fotos:
          type: array
          items:
            type: string
            format: uri
        jugadorId:
          type: string
          format: uuid
        patrocinadorId:
          type: string
          format: uuid

    ItemCarritoCreate:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: string
          format: uuid
        talla:
          type: string
          example: M
        cantidad:
          type: integer
          minimum: 1
          default: 1

    ItemCarrito:
      type: object
      required: [itemId, productoId, cantidad, precioUnitario]
      properties:
        itemId:
          type: string
          format: uuid
        productoId:
          type: string
          format: uuid
        nombre:
          type: string
        talla:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          type: number
          format: float

    Carrito:
      type: object
      required: [usuarioId, items, total]
      properties:
        usuarioId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrito'
        subtotal:
          type: number
          format: float
        descuentoSocio:
          type: number
          format: float
          description: Importe descontado por ser socio
        total:
          type: number
          format: float

    PedidoCreate:
      type: object
      required: [direccionEnvio, metodoPago]
      properties:
        direccionEnvio:
          type: string
          example: Calle Mayor 12, 10260 Madroñera
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'

    Pedido:
      type: object
      required: [pedidoId, usuarioId, items, total, estado, direccionEnvio]
      properties:
        pedidoId:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrito'
        total:
          type: number
          format: float
        descuentoSocio:
          type: number
          format: float
        direccionEnvio:
          type: string
        metodoPago:
          $ref: '#/components/schemas/MetodoPago'
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        fechaPedido:
          type: string
          format: date-time
