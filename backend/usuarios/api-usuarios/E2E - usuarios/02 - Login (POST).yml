info:
  name: 02 - Login (POST)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "test.e2e@correo.com",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.getStatus() === 200) {
            bru.setVar("test_user_id", res.getBody().usuario.usuarioId); 
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
