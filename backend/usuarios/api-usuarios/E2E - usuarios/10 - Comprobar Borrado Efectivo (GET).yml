info:
  name: 10 - Comprobar Borrado Efectivo (GET)
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/usuarios/{{test_user_id}}"
  headers:
    - name: X-User-Id
      value: "{{test_user_id}}"
    - name: X-User-Role
      value: admin
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
