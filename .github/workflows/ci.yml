name: CI - Tests Microservicios

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *'

env:
  JWT_SECRET: "01234567891011121314151617181920"
  ADMIN_EMAIL: "admin@club.test"
  ADMIN_PASSWORD: "Club2026!"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [ usuarios, compras, deportivo, entradas, estadisticas, institucional ]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/${{ matrix.servicio }}/pom.xml

      - name: Levantar PostgreSQL y RabbitMQ (Usuarios)
        if: matrix.servicio == 'usuarios'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_DB=usuarios_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=password postgres:15-alpine
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:3-management
          sleep 10

      - name: Levantar MongoDB y RabbitMQ (Resto de servicios)
        if: matrix.servicio != 'usuarios'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet asee-local --bind_ip_all
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:3-management
          sleep 10
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'asee-local',members:[{_id:0,host:'localhost:27017'}]})"

      - name: Ejecutar tests de ${{ matrix.servicio }}
        working-directory: backend/${{ matrix.servicio }}
        run: chmod +x mvnw && ./mvnw test -B

  test-e2e:
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del frontend y Chromium
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium

      - name: Levantar arquitectura completa con Docker Compose
        run: docker compose up -d --build

      - name: Esperar a que los 6 microservicios y el Gateway estén listos
        run: |
          echo "Esperando arranque de Spring Boot y Gateway..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null && \
               curl -sf http://localhost:8080/deportivo/v1/partidos > /dev/null && \
               curl -sf http://localhost:8080/institucional/v1/club/identidad > /dev/null && \
               curl -sf http://localhost:8080/entradas/v1/partidos/20000000-0000-0000-0000-000000000004/aforo > /dev/null && \
               curl -sf http://localhost:8080/compras/v1/productos > /dev/null && \
               curl -s -o /dev/null http://localhost:8081 && \
               curl -s -o /dev/null http://localhost:8085; then
              echo "Todos los servicios operativos."
              exit 0
            fi
            sleep 3
          done
          echo "Tiempo de espera agotado."
          docker compose ps
          exit 1

      - name: Cargar usuarios iniciales (staff y socio)
        working-directory: frontend
        run: npm run seed

      - name: Ejecutar tests End-to-End con Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Mostrar logs de contenedores si falla algún test
        if: failure()
        run: docker compose logs --tail=100

      - name: Subir informe visual de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7