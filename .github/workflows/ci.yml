name: CI - Tests Microservicios

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [usuarios, compras, deportivo, entradas, estadisticas, institucional]

    env:
      JWT_SECRET: 01234567891011121314151617181920

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/${{ matrix.servicio }}/pom.xml

      - name: Levantar PostgreSQL y RabbitMQ (Usuarios)
        if: matrix.servicio == 'usuarios'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_DB=usuarios_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=password postgres:15-alpine
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:3-management
          sleep 10

      - name: Levantar MongoDB y RabbitMQ (Resto de servicios)
        if: matrix.servicio != 'usuarios'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet asee-local --bind_ip_all
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:3-management
          sleep 10
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'asee-local',members:[{_id:0,host:'localhost:27017'}]})"

      - name: Ejecutar tests de ${{ matrix.servicio }}
        working-directory: backend/${{ matrix.servicio }}
        run: chmod +x mvnw && ./mvnw test -B