openapi: 3.0.3
info:
  title: API Deportivo
  description: >
    Microservicio que centraliza la actividad deportiva del club de baloncesto:
    calendario de partidos, plantilla y noticias. No realiza llamadas síncronas
    a otros microservicios. Es consultado por Entradas (fechas de partidos con
    venta abierta) y por Estadísticas e Interacción, que usa este servicio como
    fuente de identificadores de jugadores y partidos:

    Estadísticas -> Deportivo -> GET /jugadores/{jugadorId}

    Estadísticas -> Deportivo -> GET /partidos/{partidoId}

    Las estadísticas por jugador y por partido NO se exponen aquí: son
    propiedad del microservicio de Estadísticas e Interacción (ver
    estadisticas.yaml). El resultado oficial (puntosLocal/puntosVisitante)
    pertenece a Deportivo. Se accede siempre a través del API Gateway.
  version: 1.0.0

servers:
  - url: https://api.club.example/deportivo/v1
    description: Servidor de producción (vía API Gateway)
  - url: http://localhost:8082/v1
    description: Entorno local de desarrollo

tags:
  - name: Partidos
    description: Calendario y resultados
  - name: Jugadores
    description: Plantilla del equipo
  - name: Noticias
    description: Novedades del equipo (fichajes, lesiones, convocatorias)
  - name: Notificaciones
    description: Preferencias de notificación por jugador o categoría favorita

paths:
  /partidos:
    get:
      tags: [Partidos]
      summary: Listar partidos del calendario
      description: >
        Lo consulta Entradas para saber qué partidos están disponibles para
        la venta:

        Entradas -> Deportivo -> GET /partidos?ventaAbierta=true
      operationId: listarPartidos
      security: []
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoPartido'
        - name: desde
          in: query
          description: Fecha mínima (incluida)
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          description: Fecha máxima (incluida)
          schema:
            type: string
            format: date
        - name: ventaAbierta
          in: query
          description: Solo partidos con venta de entradas abierta
          schema:
            type: boolean
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Listado paginado de partidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partido'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Partidos]
      summary: Crear un partido (staff/admin)
      operationId: crearPartido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartidoCreate'
      responses:
        '201':
          description: Partido creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partidos/{partidoId}:
    parameters:
      - $ref: '#/components/parameters/PartidoId'
    get:
      tags: [Partidos]
      summary: Obtener el detalle de un partido
      description: >
        Recurso consultado síncronamente por Estadísticas para validar que el
        partido existe antes de registrar eventos o box score:

        Estadísticas -> Deportivo -> GET /partidos/{partidoId}

        También lo consulta Entradas para comprobar la venta. Estadísticas obtiene
        la temporada de este recurso.
      operationId: obtenerPartido
      security: []
      responses:
        '200':
          description: Detalle del partido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partido'
        '404':
          description: >
            No existe ningún partido con el identificador indicado. Este es
            el 404 que recibirá Estadísticas si el partidoId que consulta no
            existe en este servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Partidos]
      summary: Actualizar un partido o su resultado (staff/admin)
      description: >
        La temporada debe coincidir con la asignada al crear el partido; cambiarla
        se rechaza con 400 para mantener los agregados de Estadísticas.
      operationId: actualizarPartido
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartidoCreate'
      responses:
        '200':
          description: Partido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partido'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Partidos]
      summary: Eliminar un partido (admin)
      operationId: eliminarPartido
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Partido eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /jugadores:
    get:
      tags: [Jugadores]
      summary: Listar la plantilla
      description: >
        Consultado por el Front-end y por Estadísticas e Interacción como
        base de jugadores del club:

        Estadísticas -> Deportivo -> GET /jugadores
      operationId: listarJugadores
      security: []
      parameters:
        - name: posicion
          in: query
          schema:
            $ref: '#/components/schemas/Posicion'
        - name: activo
          in: query
          description: Filtrar por jugadores en plantilla actual
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Listado de jugadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Jugadores]
      summary: Dar de alta un jugador (staff/admin)
      operationId: crearJugador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JugadorCreate'
      responses:
        '201':
          description: Jugador creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un jugador activo con ese dorsal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /jugadores/{jugadorId}:
    parameters:
      - $ref: '#/components/parameters/JugadorId'
    get:
      tags: [Jugadores]
      summary: Obtener la ficha de un jugador
      description: >
        Recurso consultado síncronamente por Estadísticas para validar que el
        jugador existe antes de registrar un evento o estadísticas:

        Estadísticas -> Deportivo -> GET /jugadores/{jugadorId}
      operationId: obtenerJugador
      security: []
      responses:
        '200':
          description: Ficha del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '404':
          description: >
            No existe ningún jugador con el identificador indicado. Este es
            el 404 que recibirá Estadísticas si el jugadorId que consulta no
            existe en este servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Jugadores]
      summary: Actualizar la ficha de un jugador (staff/admin)
      operationId: actualizarJugador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JugadorCreate'
      responses:
        '200':
          description: Jugador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El dorsal ya está asignado a otro jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Jugadores]
      summary: Dar de baja un jugador (admin)
      operationId: eliminarJugador
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Jugador eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /noticias:
    get:
      tags: [Noticias]
      summary: Listar noticias
      operationId: listarNoticias
      security: []
      parameters:
        - name: categoria
          in: query
          schema:
            $ref: '#/components/schemas/CategoriaNoticia'
        - name: jugadorId
          in: query
          description: Noticias relacionadas con un jugador
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Listado de noticias, de más reciente a más antigua
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Noticia'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Noticias]
      summary: Publicar una noticia (staff/admin)
      operationId: crearNoticia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticiaCreate'
      responses:
        '201':
          description: Noticia publicada
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /noticias/{noticiaId}:
    parameters:
      - $ref: '#/components/parameters/NoticiaId'
    get:
      tags: [Noticias]
      summary: Obtener una noticia
      operationId: obtenerNoticia
      security: []
      responses:
        '200':
          description: Noticia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Noticias]
      summary: Editar una noticia (staff/admin)
      operationId: actualizarNoticia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticiaCreate'
      responses:
        '200':
          description: Noticia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Noticias]
      summary: Eliminar una noticia (staff/admin)
      operationId: eliminarNoticia
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Noticia eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /usuarios/{usuarioId}/preferencias-notificacion:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [Notificaciones]
      summary: Consultar preferencias de notificación
      description: >
        Acceso del propio usuario o de staff/admin, comprobado con el JWT (403 si
        no está autorizado). Deportivo conserva estas preferencias; en esta entrega
        se configura la selección, sin implementar todavía el envío de avisos.
      operationId: obtenerPreferencias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Notificaciones]
      summary: Definir jugadores y categorías favoritas
      description: >
        Acceso del propio usuario o de staff/admin, comprobado con el JWT (403 si
        no está autorizado). Deportivo conserva estas preferencias; en esta entrega
        se configura la selección, sin implementar todavía el envío de avisos.
      operationId: actualizarPreferencias
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasNotificacion'
      responses:
        '200':
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenciasNotificacion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT con expiración, validado por el API Gateway.

  parameters:
    PartidoId:
      name: partidoId
      in: path
      required: true
      description: Identificador único del partido
      schema:
        type: string
        format: uuid
    JugadorId:
      name: jugadorId
      in: path
      required: true
      description: Identificador único del jugador
      schema:
        type: string
        format: uuid
    NoticiaId:
      name: noticiaId
      in: path
      required: true
      description: Identificador único de la noticia
      schema:
        type: string
        format: uuid
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: Identificador único del usuario
      schema:
        type: string
        format: uuid
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamano:
      name: tamano
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Petición mal formada o datos no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del usuario no tiene permisos para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: integer
          example: 404
        mensaje:
          type: string
          example: Recurso no encontrado
        detalles:
          type: array
          items:
            type: string

    EstadoPartido:
      type: string
      enum: [programado, en_juego, finalizado, aplazado, suspendido]

    Posicion:
      type: string
      description: Posiciones del baloncesto
      enum: [base, escolta, alero, ala_pivot, pivot]

    CategoriaNoticia:
      type: string
      enum: [fichaje, lesion, convocatoria, cronica, club, otra]

    Partido:
      type: object
      required: [partidoId, fechaHora, rival, lugar, estado, temporada, ventaEntradasAbierta]
      properties:
        partidoId:
          type: string
          format: uuid
        fechaHora:
          type: string
          format: date-time
        rival:
          type: string
          example: CB Navalmoral
        lugar:
          type: string
          example: Pabellón Municipal de Madroñera
        esLocal:
          type: boolean
        temporada:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
          description: Temporada asignada al crear el partido; no se modifica después.
          example: '2026-2027'
        competicion:
          type: string
          example: Liga regional
        jornada:
          type: integer
          example: 7
        estado:
          $ref: '#/components/schemas/EstadoPartido'
        puntosLocal:
          type: integer
          minimum: 0
          nullable: true
        puntosVisitante:
          type: integer
          minimum: 0
          nullable: true
        ventaEntradasAbierta:
          type: boolean
          description: Indica a Entradas si el partido puede venderse

    PartidoCreate:
      type: object
      required: [fechaHora, rival, lugar, temporada]
      properties:
        fechaHora:
          type: string
          format: date-time
        rival:
          type: string
        lugar:
          type: string
        esLocal:
          type: boolean
        temporada:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
          description: Temporada asignada al crear el partido; no se modifica después.
          example: '2026-2027'
        competicion:
          type: string
        jornada:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoPartido'
        puntosLocal:
          type: integer
          minimum: 0
          nullable: true
        puntosVisitante:
          type: integer
          minimum: 0
          nullable: true
        ventaEntradasAbierta:
          type: boolean
          default: false

    Jugador:
      type: object
      required: [jugadorId, nombre, dorsal, posicion]
      properties:
        jugadorId:
          type: string
          format: uuid
        nombre:
          type: string
          example: Carlos Gómez
        dorsal:
          type: integer
          minimum: 0
          maximum: 99
          example: 10
        posicion:
          $ref: '#/components/schemas/Posicion'
        alturaCm:
          type: integer
          example: 195
        fechaNacimiento:
          type: string
          format: date
        fotoUrl:
          type: string
          format: uri
        activo:
          type: boolean

    JugadorCreate:
      type: object
      required: [nombre, dorsal, posicion]
      properties:
        nombre:
          type: string
        dorsal:
          type: integer
          minimum: 0
          maximum: 99
        posicion:
          $ref: '#/components/schemas/Posicion'
        alturaCm:
          type: integer
        fechaNacimiento:
          type: string
          format: date
        fotoUrl:
          type: string
          format: uri
        activo:
          type: boolean
          default: true

    Noticia:
      type: object
      required: [noticiaId, titulo, contenido, categoria, fechaPublicacion]
      properties:
        noticiaId:
          type: string
          format: uuid
        titulo:
          type: string
          example: El club incorpora a un nuevo base
        contenido:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaNoticia'
        jugadoresRelacionados:
          type: array
          items:
            type: string
            format: uuid
        imagenUrl:
          type: string
          format: uri
        autorId:
          type: string
          format: uuid
          description: Usuario staff que la publicó
        fechaPublicacion:
          type: string
          format: date-time

    NoticiaCreate:
      type: object
      required: [titulo, contenido, categoria]
      properties:
        titulo:
          type: string
        contenido:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaNoticia'
        jugadoresRelacionados:
          type: array
          items:
            type: string
            format: uuid
        imagenUrl:
          type: string
          format: uri

    PreferenciasNotificacion:
      type: object
      properties:
        usuarioId:
          type: string
          format: uuid
        jugadoresFavoritos:
          type: array
          items:
            type: string
            format: uuid
        categoriasFavoritas:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaNoticia'
        avisarInicioPartido:
          type: boolean
          default: true
